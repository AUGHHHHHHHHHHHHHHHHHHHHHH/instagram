name: Build Mac app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Reelvoice.app (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build app, dmg and zip
        run: bash packaging/build-mac.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reelvoice-macOS-arm64
          path: |
            dist/Reelvoice-*.dmg
            dist/Reelvoice-*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Reelvoice-*.dmg dist/Reelvoice-*.zip --clobber
          else
            gh release create "$TAG" dist/Reelvoice-*.dmg dist/Reelvoice-*.zip \
              --title "Reelvoice $TAG" --notes-file packaging/RELEASE_NOTES.md
          fi
