name: Build Mac app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Reelvoice.app (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build app, dmg and zip
        run: bash packaging/build-mac.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reelvoice-macOS-arm64
          path: |
            dist/Reelvoice-*.dmg
            dist/Reelvoice-*.zip
          if-no-files-found: error

      # A tag push releases under that tag. A manual run releases under v<package version>,
      # creating the tag on GitHub if it does not exist yet.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(python3 -c 'import sys; sys.path.insert(0, "src"); import reelvoice; print(reelvoice.__version__)')"
          fi
          echo "Releasing as $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Reelvoice-*.dmg dist/Reelvoice-*.zip --clobber
          else
            gh release create "$TAG" dist/Reelvoice-*.dmg dist/Reelvoice-*.zip \
              --target "$GITHUB_SHA" --title "Reelvoice $TAG" --notes-file packaging/RELEASE_NOTES.md
          fi
