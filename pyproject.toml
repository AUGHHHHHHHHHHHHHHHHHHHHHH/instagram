[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reelvoice"
version = "0.1.0"
description = "Easy AI text-to-speech voiceovers and auto-captioned reels for Instagram videos"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "edge-tts>=7.0",
    "gTTS>=2.5",
]

[project.optional-dependencies]
app = ["pywebview>=5.0"]

[project.scripts]
reelvoice = "reelvoice.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["reelvoice"]

[tool.setuptools.package-data]
reelvoice = ["ui.html", "fonts/*.ttf", "fonts/*.txt"]
